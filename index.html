<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c10">
<title>TYLE X — потоковый плеер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar glass">
    <div class="logo">TYLE<em>X</em></div>
    <div class="search">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <input type="text" id="q" placeholder="Поиск полных треков…" autocomplete="off" spellcheck="false">
      <button class="icon-mini" id="clearBtn" hidden aria-label="Очистить">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
      <div class="spin" id="spin" hidden></div>
    </div>
    <button class="upload" id="uploadBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
      <span>Загрузить MP3</span>
    </button>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.ogg,.m4a,.flac,.wav" multiple hidden>
  </header>

  <div class="content">

    <section class="panel glass list-panel">
      <div class="panel-head">
        <span class="label">Плейлист</span>
        <span class="meta" id="meta">введите запрос — полные треки с нод Piped / Invidious</span>
      </div>
      <div class="results" id="results"></div>
    </section>

    <aside class="player glass">
      <div class="np-label"><span class="live"></span>Сейчас играет</div>

      <div class="disc-wrap">
        <div class="disc noart" id="disc"><img id="cover" alt="Обложка"></div>
      </div>

      <div class="np-title" id="npTitle">Ничего не играет</div>
      <div class="np-artist" id="npArtist">Найдите трек или перетащите файлы</div>
      <div class="pills">
        <span class="pill" id="pillSrc" hidden></span>
        <span class="pill q" id="pillQ" hidden></span>
      </div>

      <div class="seek-row">
        <span class="time" id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0">
        <span class="time" id="tDur">0:00</span>
      </div>

      <div class="controls">
        <button class="ctl" id="btnShuffle" title="Перемешать">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="ctl" id="btnPrev" title="Предыдущий">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="currentColor"><path d="M18 6l-8.5 6L18 18V6zM6 6h2v12H6z"/></svg>
        </button>
        <button class="ctl big" id="btnPlay" title="Плей / Пауза">
          <svg id="icoPlay" viewBox="0 0 24 24" width="27" height="27" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icoPause" viewBox="0 0 24 24" width="27" height="27" fill="currentColor" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="ctl" id="btnNext" title="Следующий">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="currentColor"><path d="M6 6l8.5 6L6 18V6zM16 6h2v12h-2z"/></svg>
        </button>
        <button class="ctl" id="btnRepeat" title="Повтор">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <span class="rep" id="repBadge"></span>
        </button>
      </div>

      <div class="vol-row">
        <button class="ctl small" id="muteBtn" title="Mute">
          <svg id="icoVol" viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="icoMute" viewBox="0 0 24 24" width="19" height="19" fill="currentColor" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" id="vol" min="0" max="100" value="90">
      </div>
    </aside>

  </div>
</div>

<div class="drop" id="drop"><div class="drop-box">Отпустите файлы — они добавятся в плейлист</div></div>
<div id="toasts"></div>
<audio id="audio" preload="metadata"></audio>

<script src="script.js"></script>
</body>
</html>
